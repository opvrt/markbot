services:
  postgres:
    image: postgres:16
    container_name: markbot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: markbot
    restart: unless-stopped
    depends_on:
    - postgres
    environment:
      DB_HOST: postgres
    command: ["./markbot"]

volumes:
  pgdata:
